# Make sure to update the credential placeholders with your own secrets.
# We mark them with # CHANGEME in the file below.
# Infrastructure (qdrant, minio, redis, app-postgres) is bound to localhost
# (127.0.0.1) so it only accepts connections from the local machine; the app
# services (backend, client) publish to all interfaces on purpose.
#
# The image ships the embedding model (Xenova/all-MiniLM-L6-v2) inside
# node_modules, but @huggingface/transformers still dials huggingface.co on load
# to check for a newer revision. With no egress that is `ETIMEOUT`, and it took
# the whole question-enrichment job down despite the weights being on disk.
# These make the loader strictly offline. HFEmbeddings.lib.ts also passes
# local_files_only so the code does not depend on this env being set.
x-offline-embeddings: &offline-embeddings
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped

    ports:
      # Bound to loopback: Qdrant ships with no auth, so a published port here
      # is an unauthenticated read/write dump of every user's document vectors.
      - "127.0.0.1:6333:6333"   # REST API
      - "127.0.0.1:6334:6334"   # gRPC API

    volumes:
      - ./qdrant_storage:/qdrant/storage

    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334

  minio:
    image: cgr.dev/chainguard/minio
    restart: always
    entrypoint: sh
    # No bucket is pre-created here. The app creates its own on first use via
    # MinioFileStorage (makeBucket), so the command is just the server.
    command: -c 'minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniosecret} # CHANGEME
    ports:
      # Loopback only: 9000 speaks S3 with the default `miniosecret` root
      # credential, so exposing it grants full read/write/delete on the bucket.
      # The backend reaches MinIO over the compose network as `minio:9000` and
      # never needs the host mapping; this exists for local admin tooling.
      - "127.0.0.1:9090:9000"
      - 127.0.0.1:9091:9001
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    image: docker.io/redis:7
    restart: always
    # CHANGEME: row below to secure redis password
    command: >
      --requirepass ${REDIS_AUTH:-myredissecret}
      --maxmemory-policy noeviction
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  # Application database for pdf-rag (users, documents, chat sessions, messages)
  app-postgres:
    image: docker.io/postgres:17
    container_name: app-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: ${APP_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-postgres} # CHANGEME
      POSTGRES_DB: ${APP_DB_NAME:-pdfrag}
      TZ: UTC
      PGTZ: UTC
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - app_postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
      app-postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      DATABASE_URL: postgresql://${APP_DB_USER:-postgres}:${APP_DB_PASSWORD:-postgres}@app-postgres:5432/${APP_DB_NAME:-pdfrag}?schema=public
      SERVER_PORT: 5000
      NODE_ENV: development
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret} # CHANGEME
      REDIS_URL: redis://:${REDIS_AUTH:-myredissecret}@redis:6379
      # Pinned off even if backend/.env opts in for local `bun run dev`:
      # `environment` wins over `env_file`, so the Docker stack never serves
      # unauthenticated requests as a shared dev-user.
      ALLOW_DEV_AUTH: "false"
      # DEV-ONLY, and safe to delete the moment a mailer exists. Returns the
      # password-reset link in the API response so the flow is usable without
      # email. Port 5000 is published on all interfaces, so anyone who can
      # reach it could mint a reset link for a known address and take over that
      # account. Never enable this outside a local dev stack.
      DEV_PASSWORD_RESET: "true"
      <<: *offline-embeddings
    ports:
      - "5000:5000"
    command: sh -c "bun run dev"
    volumes:
      - ./backend/src:/app/src

  # Phase 2 of document processing: generates the six hypothetical questions
  # per chunk and writes them to Qdrant. Runs separately from `worker` so a
  # slow or rate-limited model never delays phase 1 (or blocks the queue).
  enricher:
    build: ./backend
    container_name: enricher
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      DATABASE_URL: postgresql://${APP_DB_USER:-postgres}:${APP_DB_PASSWORD:-postgres}@app-postgres:5432/${APP_DB_NAME:-pdfrag}?schema=public
      NODE_ENV: development
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret} # CHANGEME
      REDIS_URL: redis://:${REDIS_AUTH:-myredissecret}@redis:6379
      ALLOW_DEV_AUTH: "false"
      <<: *offline-embeddings
    command: sh -c "bun run worker:enrich"
    volumes:
      - ./backend/src:/app/src

  worker:
    build: ./backend
    container_name: worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      DATABASE_URL: postgresql://${APP_DB_USER:-postgres}:${APP_DB_PASSWORD:-postgres}@app-postgres:5432/${APP_DB_NAME:-pdfrag}?schema=public
      NODE_ENV: development
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniosecret} # CHANGEME
      REDIS_URL: redis://:${REDIS_AUTH:-myredissecret}@redis:6379
      ALLOW_DEV_AUTH: "false"
      <<: *offline-embeddings
    command: sh -c "bun run worker"
    volumes:
      - ./backend/src:/app/src


  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
      args:
        BACKEND_URL: http://backend:5000
    container_name: client
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:5000
      # The chat WebSocket bypasses the Next.js rewrite layer, so the browser
      # needs the backend's host-reachable URL. `host.docker.internal` maps to
      # the Docker host, where port 5000 is published.
      NEXT_PUBLIC_WS_URL: ws://localhost:5000
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      # Container port must match client/Dockerfile.dev, which serves Next.js
      # with `-p 3000`. Pointing this at any other port leaves nothing listening.
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
      - client_next:/app/.next

volumes:
  # The `langfuse_` prefix on the next two is a legacy misnomer: Langfuse was
  # removed, but the app inherited these volumes. They hold live pdf-rag data
  # and must NOT be pruned alongside the old Langfuse ones.
  #   langfuse_minio_data - uploaded documents (the `documents` bucket)
  #   langfuse_redis_data - BullMQ queues and rate-limit counters
  langfuse_minio_data:
    driver: local
  langfuse_redis_data:
    driver: local
  app_postgres_data:
    driver: local
  client_node_modules:
  client_next:
